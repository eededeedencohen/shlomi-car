    <!-- Loading screen. It is painted before any JavaScript runs and lives OUTSIDE #root, so React never
         redraws it (its animation is never restarted); src/lib/bootSplash.js hides it once the data is in
         and at least three seconds have passed. The sequence: the badge comes in and leaves (about a second),
         then only the tyre keeps spinning over the rolling road. -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #26407a 0%, #172541 48%, #0b1328 100%);
        opacity: 1;
        transition: opacity 0.45s ease;
      }
      .boot--hide {
        opacity: 0;
        pointer-events: none;
      }
      .boot--gone {
        display: none;
      }
      .boot-stage {
        grid-area: 1 / 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* stage 1: the badge, about a second */
      .boot-logo-wrap {
        position: relative;
        width: min(60vw, 240px);
        aspect-ratio: 1 / 1;
        animation: boot-logo 1.25s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .boot-logo {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.55));
      }
      .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(203, 213, 225, 0.65);
        opacity: 0;
        animation: boot-ring 1s 0.22s ease-out both;
      }
      .boot-ring--late {
        animation-delay: 0.46s;
      }
      .boot-shine {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        overflow: hidden;
        pointer-events: none;
      }
      .boot-shine::after {
        content: '';
        position: absolute;
        top: -20%;
        bottom: -20%;
        left: -70%;
        width: 40%;
        transform: skewX(-20deg);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
        animation: boot-shine 0.7s 0.4s ease-in-out both;
      }

      /* stage 2: only the tyre, for the rest of the wait */
      .boot-stage-wheel {
        opacity: 0;
        animation: boot-wheel-in 0.6s 1.02s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .boot-wheel {
        display: block;
        width: min(40vw, 156px);
        height: auto;
        animation: boot-spin 0.95s linear infinite;
        filter: drop-shadow(0 12px 20px rgba(0, 0, 0, 0.5));
      }
      .boot-shadow {
        width: min(30vw, 116px);
        height: 12px;
        margin-top: 6px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(0, 0, 0, 0.5), transparent);
      }
      .boot-road {
        width: min(64vw, 250px);
        height: 5px;
        margin-top: 8px;
        border-radius: 3px;
        background: repeating-linear-gradient(90deg, #cbd5e1 0 26px, transparent 26px 42px);
        animation: boot-road 0.5s linear infinite;
        opacity: 0.7;
      }

      @keyframes boot-logo {
        0% {
          opacity: 0;
          transform: scale(0.5) rotate(-16deg);
          filter: blur(8px);
        }
        36% {
          opacity: 1;
          transform: scale(1.07) rotate(0deg);
          filter: blur(0);
        }
        50% {
          transform: scale(1);
        }
        80% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.4);
        }
      }
      @keyframes boot-ring {
        from {
          opacity: 0.75;
          transform: scale(0.92);
        }
        to {
          opacity: 0;
          transform: scale(1.6);
        }
      }
      @keyframes boot-shine {
        from {
          left: -70%;
        }
        to {
          left: 135%;
        }
      }
      @keyframes boot-wheel-in {
        from {
          opacity: 0;
          transform: scale(0.35);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-road {
        from {
          background-position: 0 0;
        }
        to {
          background-position: -42px 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring,
        .boot-shine::after,
        .boot-road {
          animation: none;
        }
        .boot-wheel {
          animation-duration: 2.4s;
        }
      }
